services:
  - type: web
    name: beta-platform-app
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_MODE
        value: supabase
      - key: VITE_PERSISTENCE_FALLBACK_MODE
        value: disabled
      - key: VITE_APP_URL
        value: https://app.oibeta.com.br
      - key: APP_URL
        value: https://app.oibeta.com.br
      - key: VITE_INSTITUTIONAL_URL
        value: https://www.oibeta.com.br
      - key: ALLOWED_ORIGINS
        value: https://www.oibeta.com.br,https://oibeta.com.br,https://app.oibeta.com.br
      - key: ENABLE_BACKGROUND_SCHEDULERS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_ENCRYPTION_KEY
        generateValue: true
      - key: AI_GATEWAY_KEY
        sync: false
      - key: VITE_AI_GATEWAY_URL
        sync: false
      - key: VITE_PNCP_BASE_URL
        sync: false
      - key: VITE_COMPRAS_GOV_BASE_URL
        sync: false

  - type: web
    name: oibeta-site
    runtime: static
    rootDir: oibeta-site
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_PLATFORM_URL
        value: https://app.oibeta.com.br
