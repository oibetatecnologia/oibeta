name: Validacao da Beta Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validar:
    name: Lint e Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build